[project]
name = "rag-framework"
version = "0.1.0"
description = "Observable, provider-agnostic RAG framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0,<1.0.0",
    "chromadb>=0.5.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "langchain-chroma>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0.0,<6.0.0"]
llm = [
    "langchain-openai>=1.0.0,<2.0.0",
]
elasticsearch = [
    "elasticsearch[async]>=8.15.0,<9.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires an external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
